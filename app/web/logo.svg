<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="0"/>
    </radialGradient>

    <!-- Main V 3D Gradient -->
    <linearGradient id="vBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Right Arm Specular Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f3e8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Equalizer Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Music Note Gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadow & Neon Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7e22ce" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="220" r="220" fill="url(#bgGlow)"/>

  <!-- LOGO MARK GROUP -->
  <g filter="url(#softShadow)" transform="translate(0, -10)">
    
    <!-- 1. AUDIO VISUALIZER / SOUNDWAVE BARS (CENTER INSIDE V) -->
    <g filter="url(#neonGlow)">
      <!-- Bar 1 (Leftmost - Short) -->
      <line x1="184" y1="180" x2="184" y2="220" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
      <!-- Bar 2 -->
      <line x1="206" y1="150" x2="206" y2="250" stroke="url(#waveGrad)" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Bar 3 -->
      <line x1="228" y1="115" x2="228" y2="275" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round"/>
      <!-- Bar 4 (Center - Tallest) -->
      <line x1="250" y1="90"  x2="250" y2="295" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- Bar 5 -->
      <line x1="272" y1="115" x2="272" y2="275" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round"/>
      <!-- Bar 6 -->
      <line x1="294" y1="150" x2="294" y2="250" stroke="url(#waveGrad)" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Bar 7 (Rightmost - Short) -->
      <line x1="316" y1="180" x2="316" y2="220" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- 2. MAIN 3D 'V' SHAPE -->
    <!-- Outer Metallic V Body -->
    <path d="M 130 95
             C 120 95, 112 105, 118 118
             L 225 365
             C 236 390, 264 390, 275 365
             L 382 118
             C 388 105, 380 95, 370 95
             L 322 95
             C 314 95, 307 101, 303 109
             L 250 240
             L 197 109
             C 193 101, 186 95, 178 95
             Z"
          fill="url(#vBodyGrad)"
          filter="url(#neonGlow)"/>

    <!-- Left Arm Inner Shading for 3D depth -->
    <path d="M 130 95
             L 178 95
             C 186 95, 193 101, 197 109
             L 250 240
             L 225 365
             C 236 390, 245 385, 245 365
             L 118 118
             C 112 105, 120 95, 130 95 Z"
          fill="#581c87"
          opacity="0.35"/>

    <!-- Right Arm Edge Specular Highlight -->
    <path d="M 370 95
             L 382 118
             L 275 365
             C 264 390, 236 390, 225 365
             L 235 360
             C 245 380, 260 380, 268 360
             L 365 105
             C 368 98, 370 95, 370 95 Z"
          fill="url(#highlightGrad)"
          opacity="0.7"/>

    <!-- 3. INTEGRATED EIGHTH MUSIC NOTE (OVERLAPPING BOTTOM RIGHT V) -->
    <g filter="url(#neonGlow)">
      <!-- Note Head -->
      <ellipse cx="275" cy="340" rx="28" ry="20" transform="rotate(-25 275 340)" fill="url(#noteGrad)"/>
      <!-- Note Stem -->
      <path d="M 294 330 Q 302 260 308 200 Q 309 190 314 190 Q 318 190 316 200 L 302 322 Z" fill="url(#noteGrad)"/>
      <!-- Note Flag/Tail -->
      <path d="M 310 195 Q 345 220 338 270 Q 330 240 312 215 Z" fill="url(#noteGrad)"/>
    </g>
  </g>

  <!-- BRAND NAME & TAGLINE (OPTIONAL DISPLAY) -->
  <g text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif">
    <!-- "VERSE" Title with custom styled E's aspect -->
    <text x="250" y="435" font-size="44" font-weight="800" letter-spacing="14" fill="#ffffff" filter="url(#neonGlow)">
      VERSE
    </text>
    <!-- Tagline -->
    <text x="250" y="468" font-size="13" font-weight="600" letter-spacing="6" fill="#c084fc" opacity="0.9">
      YOUR MUSIC, YOUR VERSE.
    </text>
  </g>
</svg>
